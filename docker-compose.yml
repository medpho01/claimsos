version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: MMoo@1234
      POSTGRES_DB: medpho
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Backend
    container_name: hospital_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      - postgres

volumes:
  postgres_data:
