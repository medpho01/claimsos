version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./Backend/src/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./Backend
    container_name: hospital_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      - postgres

  webapp:
    build: ./webapp
    container_name: hospital_webapp
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
