version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: hospital_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-6001}:8000"
    env_file:
      - ./Backend/.env

  webapp:
    build: ./webapp
    container_name: hospital_webapp
    restart: always
    ports:
      - "${WEBAPP_PORT:-5001}:80"
    depends_on:
      - backend