version: '3.8'

# ⚠️  PRODUCTION CONFIGURATION
# For development with hot reload, use: docker-compose -f docker-compose.dev.yml up
# See DOCKER_DEV.md for full development setup instructions

services:
  backend:
    build: ./Backend
    container_name: hospital_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-6001}:8000"
    env_file:
      - ./Backend/.env
    environment:
      # Workers run in the dedicated `worker` service. API process only
      # enqueues jobs; doesn't process them.
      - RUN_WORKERS=false
    depends_on:
      - redis

  # Dedicated worker container — see docker-compose.dev.yml for rationale.
  worker:
    build: ./Backend
    container_name: hospital_worker
    restart: always
    env_file:
      - ./Backend/.env
    environment:
      - RUN_WORKERS=true
    depends_on:
      - redis

  webapp:
    build: ./webapp
    container_name: hospital_webapp
    restart: always
    ports:
      - "${WEBAPP_PORT:-5001}:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: hospital_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data: