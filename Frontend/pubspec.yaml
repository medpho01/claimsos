name: hospital_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3
  video_player: ^2.10.1
  gal: ^2.3.2
  open_filex: ^4.7.0
  photo_manager: ^3.8.3
  geolocator: ^14.0.2
  dio: ^5.9.0
  exif: ^3.3.0
  image: ^4.7.2
  intl: ^0.20.2
  geocoding: ^4.0.0
  photo_manager_image_provider: ^2.2.0
  http: ^1.6.0
  google_fonts: ^6.3.3
  typed_data: ^1.4.0
  flutter_image_compress: ^2.4.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.0
  envied: ^0.5.3
  file_picker: ^10.3.8
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  package_info_plus: ^8.0.0 
  pub_semver: ^2.1.4
  connectivity_plus: ^6.0.0
  flutter_pdfview: ^1.3.2
  pdfx: ^2.9.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^0.5.3
  build_runner: ^2.4.6
  flutter_launcher_icons: "^0.13.1" 

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Appiconcoloured.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/icon/Appiconcoloured.png"
  
  adaptive_icon_monochrome: "assets/icon/Appicon.png"
